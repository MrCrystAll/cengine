name: Setup build environment
description: Ninja, vcpkg (cloned + bootstrapped) with a cached binary archive, MSVC env on Windows.

inputs:
  cache-key:
    description: Extra key segment so each job/preset gets its own vcpkg binary cache
    required: true
  llvm-version:
    description: >
      Linux only: install this Clang/clang-tidy major version from the Ubuntu archive and make it
      the `clang++` / `clang-tidy` on PATH. Needed because Ubuntu 24.04's default Clang 18 cannot
      use libstdc++'s std::expected (it reports __cpp_concepts < 202002). Empty = keep the default.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install Ninja
      uses: seanmiddleditch/gha-setup-ninja@v6

    - name: Install Clang ${{ inputs.llvm-version }}
      if: runner.os == 'Linux' && inputs.llvm-version != ''
      shell: bash
      env:
        LLVM_VERSION: ${{ inputs.llvm-version }}
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y "clang-${LLVM_VERSION}" "clang-tidy-${LLVM_VERSION}"
        # Presets ask for plain `clang++`; shadow the default version without touching /usr/bin.
        bin="${RUNNER_TEMP}/llvm-bin"
        mkdir -p "$bin"
        for tool in clang clang++ clang-tidy; do
          ln -sf "/usr/bin/${tool}-${LLVM_VERSION}" "$bin/${tool}"
        done
        echo "$bin" >> "$GITHUB_PATH"
        "$bin/clang++" --version

    - name: MSVC developer environment
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Export vcpkg paths
      shell: bash
      run: |
        echo "VCPKG_ROOT=${RUNNER_TEMP}/vcpkg" >> "$GITHUB_ENV"
        echo "VCPKG_DEFAULT_BINARY_CACHE=${RUNNER_TEMP}/vcpkg-binary-cache" >> "$GITHUB_ENV"
        mkdir -p "${RUNNER_TEMP}/vcpkg-binary-cache"

    - name: Restore vcpkg binary cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/vcpkg-binary-cache
        key: vcpkg-${{ runner.os }}-${{ inputs.cache-key }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-${{ inputs.cache-key }}-

    - name: Clone vcpkg
      shell: bash
      run: git clone --depth 1 https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"

    - name: Bootstrap vcpkg (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: '& "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics'

    - name: Bootstrap vcpkg (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: '"$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics'
