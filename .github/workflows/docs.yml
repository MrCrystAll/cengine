name: Docs

# Publishes the Doxygen site to GitHub Pages.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Doxygen, Graphviz, Ninja
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz ninja-build
      - name: Build docs
        run: cmake --workflow --preset docs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/docs/docs/html

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
